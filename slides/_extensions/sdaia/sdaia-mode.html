<script>
(function () {
  var o = window.SDAIA_OPTIONS || { toggle: true };
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function stored() {
    try { var s = localStorage.getItem("sdaia-mode"); return s === "light" || s === "dark" ? s : null; }
    catch (e) { return null; }
  }
  function apply(mode) {
    root.classList.toggle("sdaia-mode-dark", mode === "dark");
    var btn = document.querySelector(".sdaia-mode-toggle");
    if (btn) {
      var next = mode === "dark" ? "light" : "dark";
      btn.setAttribute("aria-label", "Switch to " + next + " mode");
      btn.setAttribute("title", "Switch to " + next + " mode (D)");
    }
  }
  function current() { return root.classList.contains("sdaia-mode-dark") ? "dark" : "light"; }
  function toggle() {
    var next = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("sdaia-mode", next); } catch (e) {}
    apply(next);
  }

  // Follow the OS while the deck is in auto mode and the viewer hasn't chosen
  if (o.mode === "auto" && media && media.addEventListener) {
    media.addEventListener("change", function (e) {
      if (!(o.toggle && stored())) apply(e.matches ? "dark" : "light");
    });
  }

  if (!o.toggle) return;

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "sdaia-mode-toggle";
  btn.innerHTML =
    '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' +
    '<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  btn.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
  document.body.appendChild(btn);
  apply(current());

  function bindKey() {
    if (window.Reveal && Reveal.addKeyBinding) {
      Reveal.addKeyBinding({ keyCode: 68, key: "D", description: "Toggle light / dark mode" }, toggle);
    }
  }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) bindKey();
  else if (window.Reveal && Reveal.on) Reveal.on("ready", bindKey);
})();
</script>
